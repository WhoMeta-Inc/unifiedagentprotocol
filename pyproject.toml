[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-agent-protocol"
version = "1.1.0"
description = "Unified Agent Protocol — Universal interoperability layer for AI agents and tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "WhoMeta Inc.", email = "opensource@whometa.io"}]
maintainers = [{name = "WhoMeta Labs", email = "labs@whometa.io"}]
keywords = [
    "ai-agents", "protocol", "interoperability", "agent-tools",
    "mcp", "a2a", "openai", "anthropic", "gemini", "openapi",
    "langchain", "openwebui", "agent-orchestration", "tool-integration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Framework :: Pydantic :: 2",
]

# Core stays minimal — bridges are stdlib-only.
dependencies = [
    "pydantic>=2.5,<3.0",
    "typer>=0.9,<1.0",
]

[project.optional-dependencies]
# Optional runtime (FastAPI adapter, registry server)
runtime = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
]

# Optional registry backends
registry = [
    "redis>=5.0,<6.0",
]

# JSON Schema validation in tests
validate = [
    "jsonschema>=4.21,<5.0",
]

# YAML input on CLI
yaml = [
    "pyyaml>=6.0,<7.0",
]

# Developer tooling
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.8",
    "fastapi>=0.110",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

# Documentation
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

all = [
    "unified-agent-protocol[runtime,registry,validate,yaml]",
]

[project.urls]
Homepage = "https://www.whometa.io"
Repository = "https://github.com/WhoMeta-Inc/unifiedagentprotocol"
"Bug Tracker" = "https://github.com/WhoMeta-Inc/unifiedagentprotocol/issues"
Changelog = "https://github.com/WhoMeta-Inc/unifiedagentprotocol/blob/main/CHANGELOG.md"

[project.scripts]
uap = "unifiedagentprotocol.cli.main:app"

[project.entry-points."uap.bridges"]
mcp = "unifiedagentprotocol.bridges.mcp"
a2a = "unifiedagentprotocol.bridges.a2a"
openai = "unifiedagentprotocol.bridges.openai"
anthropic = "unifiedagentprotocol.bridges.anthropic"
gemini = "unifiedagentprotocol.bridges.gemini"
openapi = "unifiedagentprotocol.bridges.openapi"
swagger = "unifiedagentprotocol.bridges.swagger"
openwebui = "unifiedagentprotocol.bridges.openwebui"
langchain = "unifiedagentprotocol.bridges.langchain"

[tool.setuptools.packages.find]
where = ["."]
include = ["unifiedagentprotocol*"]
exclude = ["tests*", "examples*", "scripts*"]

[tool.setuptools.package-data]
"unifiedagentprotocol" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["unifiedagentprotocol"]
omit = ["*/tests/*", "*/__pycache__/*", "scripts/*"]
