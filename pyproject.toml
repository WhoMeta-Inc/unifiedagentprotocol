[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uap-core"
version = "0.1.0"
description = "Unified Agent Protocol Core SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "WhoMeta", email = "opensource@whometa.com"}
]
dependencies = [
    "pydantic>=1.10",
    "typer>=0.9",
    "requests>=2.31",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/WhoMeta-Inc/unifiedagentprotocol"

[project.scripts]
uap = "unifiedagentprotocol.cli.__main__:app"
