[metadata]
name = unified-agent-protocol
description = Unified Agent Protocol Core SDK
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = WhoMeta
url = https://github.com/WhoMeta-Inc/unifiedagentprotocol

[options]
packages = find:
python_requires = >=3.10
include_package_data = true

[options.package_data]
* = *.json

[tool:pytest]
addopts = -ra -p no:langsmith
